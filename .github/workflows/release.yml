name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TARGET: thumbv6m-none-eabi

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - uses: extractions/setup-just@v2

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi
          cargo install elf2uf2-rs --locked

      - name: Resolve release version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "protov-hal") | .version')"
          if [ "${tag}" != "${cargo_version}" ]; then
            echo "Tag v${tag} does not match protov-hal version ${cargo_version}" >&2
            exit 1
          fi
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build firmware bundle
        run: just release-bundle "${{ steps.version.outputs.version }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/protov-firmware-${{ steps.version.outputs.version }}.tar.gz
            dist/A.0/protov-${{ steps.version.outputs.version }}-A.0.uf2
            dist/A.1/protov-${{ steps.version.outputs.version }}-A.1.uf2
            dist/A.2/protov-${{ steps.version.outputs.version }}-A.2.uf2
            dist/SHA256SUMS
            dist/MANIFEST.txt
