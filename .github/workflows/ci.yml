name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'hardware/**'
      - 'res/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'hardware/**'
      - 'res/**'
      - '**.md'

env:
  HOST_TARGET: x86_64-unknown-linux-gnu

jobs:
  test-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - uses: extractions/setup-just@v2
      - run: cargo fmt --all -- --check
      - run: just checks

  build-firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [hw-a0, hw-a1, hw-a2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: extractions/setup-just@v2
      - name: Build ${{ matrix.profile }}
        run: |
          case "${{ matrix.profile }}" in
            hw-a1) just build-a1 ;;
            hw-a0) just build-a0 ;;
            hw-a2) just build-a2 ;;
          esac

  test-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p protov-hal-mock --target x86_64-unknown-linux-gnu --features hw-a1
