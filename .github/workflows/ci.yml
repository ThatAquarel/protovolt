name: CI

on:
  push:
  pull_request:

jobs:
  test-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test -p protov-core --all-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p protov-core --all-features -- -D warnings

  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - run: cargo build -p protov-hal --target thumbv6m-none-eabi --release
