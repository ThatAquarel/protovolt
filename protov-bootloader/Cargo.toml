[package]
name = "protov-bootloader"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "ProtoV RP2040 embassy-boot bootloader"
publish = false

[[bin]]
name = "protov-bootloader"
path = "src/main.rs"
test = false
bench = false

[dependencies]
protov-nvm = { path = "../protov-nvm", features = ["bootloader"] }

defmt = { version = "1.1", optional = true }
defmt-rtt = { version = "0.4", optional = true }

embassy-rp = { version = "0.10", features = ["rp2040", "time-driver"] }
embassy-boot-rp = { version = "0.10" }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5" }

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7" }
embedded-storage = "0.3.1"
embedded-storage-async = "0.4.1"

[features]
default = []
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "embassy-boot-rp/defmt",
    "embassy-rp/defmt",
    "embassy-time/defmt",
]

[package.metadata.embassy]
build = [{ target = "thumbv6m-none-eabi" }]
