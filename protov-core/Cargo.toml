[package]
name = "protov-core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]

[dependencies]
heapless = "0.8"
micromath = "2.1.0"
static_cell = "2.1.0"
embedded-graphics = { version = "0.8.1", default-features = false }
smart-leds = "0.4.0"
protov-nvm = { path = "../protov-nvm" }
protov-scpi = { path = "../protov-scpi", features = ["limits"] }

[dev-dependencies]
rstest = "0.23"

[features]
test-harness = []
simulator = ["test-harness"]
hw-a0 = []
hw-a1 = []
hw-a2 = []

[[test]]
name = "integration"
required-features = ["test-harness"]
