[package]
name = "protov-hal-mock"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "protov-mock"
path = "src/main.rs"

[dependencies]
protov-core = { path = "../protov-core", features = ["simulator"] }
protov-scpi = { path = "../protov-scpi", features = ["std"] }
heapless = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
protov-scpi = { path = "../protov-scpi", features = ["std"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serial_test = "3"

[features]
default = ["hw-a1"]
hw-a0 = ["protov-core/hw-a0"]
hw-a1 = ["protov-core/hw-a1"]
hw-a2 = ["protov-core/hw-a2"]
