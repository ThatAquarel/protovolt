[package]
name = "protov-hal-mock"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "protov-mock"
path = "src/main.rs"

[[bin]]
name = "render-ui"
path = "src/bin/render_ui.rs"
required-features = ["render-ui"]

[dependencies]
protov-core = { path = "../protov-core", features = ["simulator"] }
protov-scpi = { path = "../protov-scpi", features = ["std"] }
protov-ui = { path = "../protov-ui", optional = true }
embedded-graphics = { version = "0.8.1", optional = true }
embedded-graphics-simulator = { version = "0.7.0", optional = true, default-features = false }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
serde_yaml = "0.9"
heapless = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
protov-scpi = { path = "../protov-scpi", features = ["std"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serial_test = "3"

[features]
default = ["hw-a1"]
render-ui = [
    "dep:protov-ui",
    "dep:embedded-graphics",
    "dep:embedded-graphics-simulator",
    "dep:image",
]
hw-a0 = ["protov-core/hw-a0"]
hw-a1 = ["protov-core/hw-a1"]
hw-a2 = ["protov-core/hw-a2"]
